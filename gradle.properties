# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version = 1.21.11
yarn_mappings = 1.21.11+build.2
loader_version = 0.18.4

# Fabric API
fabric_version = 0.140.0+1.21.11

# Void Client dev: auto-join this server on `runClient` so rendering tests don't
# share the CPU with the integrated server. Uncomment and set host[:port].
# To keep your server address out of the repo, put this line in
# ~/.gradle/gradle.properties instead of here.
# void_smp_address = play.voidsmp.example:25565

# Mod Properties
mod_version = 0.6.7-dev
maven_group = net.vulkanmod
archives_base_name = VulkanMod_1.21.11

void_smp_address = 108.197.182.119
# Your in-game name for the offline server, so runClient joins as the right
# account (not the default dev name). Set it below or in ~/.gradle/gradle.properties.
# void_smp_username = YourName